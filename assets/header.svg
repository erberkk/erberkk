<svg xmlns="http://www.w3.org/2000/svg" width="800" height="208" viewBox="0 0 800 208" role="img" aria-label="Erberk Akbulut, Software Engineer at Aras Kargo, İstanbul">
  <title>Erberk Akbulut</title>
  <style>
    svg{--bg:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;}
    @media (prefers-color-scheme: dark){svg{--bg:#0d1117;--border:#30363d;--text:#e6edf3;--muted:#8b949e;}}
    text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--text)}
    .hi{font-size:18px;fill:var(--muted)}
    .name{font-size:40px;font-weight:700;letter-spacing:-1px}
    .role{font-size:15px;fill:var(--muted)}
    .prompt{font-size:16px;font-weight:600;fill:var(--muted)}
    .phrase{font-size:16px;font-weight:500;fill:var(--text)}
    .cell{opacity:var(--o);animation:wave 4.2s ease-in-out infinite}
    .fade{animation:fade .8s ease-out both}
    @keyframes wave{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * 0.25 + 0.05)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect x="0.5" y="0.5" width="799" height="207" rx="12" style="fill:var(--bg);stroke:var(--border)"/>

